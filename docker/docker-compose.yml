# Vollautomatische Day-ahead-Pipeline. Ein Profil je GPU-Hersteller.
#
#   NVIDIA:  docker compose --profile nvidia up -d --build
#   AMD:     docker compose --profile amd    up -d --build
#
# Voraussetzung: eine .env im Repo-Root (siehe .env.example) mit ENTSOE_API_KEY
# (Pflicht) und optional ARENA_API_KEY + SUBMIT_ENABLED=true fuer echte Abgabe.
# Daten (data/) und der HuggingFace-Cache werden als Volumes persistiert.

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file: [../.env]
  working_dir: /app
  volumes:
    - ../data:/app/data
    - hf-cache:/root/.cache/huggingface
  restart: unless-stopped

services:
  pipeline-nvidia:
    <<: *common
    profiles: ["nvidia"]
    image: energy-pipeline:nvidia
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BASE: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  pipeline-amd:
    <<: *common
    profiles: ["amd"]
    image: energy-pipeline:amd
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BASE: rocm/pytorch:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add: ["video"]
    security_opt: ["seccomp:unconfined"]

volumes:
  hf-cache: {}
